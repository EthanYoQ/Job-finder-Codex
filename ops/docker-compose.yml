version: "3.9"

# Recommended baseline for the full stack: 4 vCPU and 8 GB RAM.
# Put Cloudflare or an equivalent WAF/CDN in front of nginx; this file keeps
# the origin generic and does not assume an ICP filing. Aliyun Korea / Seoul
# is a valid origin placement for the application and PostgreSQL services.

services:
  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jobfinder}
      POSTGRES_USER: ${POSTGRES_USER:-jobfinder}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - internal

  web:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["npm", "run", "start"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"
    networks:
      - internal

  worker:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["sh", "-lc", "npm run p0:crawl -- --force"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  scheduler:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    command:
      [
        "sh",
        "-lc",
        "while true; do npm run p0:crawl -- --force; sleep ${CRAWL_INTERVAL_SECONDS:-43200}; done"
      ]
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      CRAWL_INTERVAL_SECONDS: ${CRAWL_INTERVAL_SECONDS:-43200}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Locked origin example: mount a provider-managed trusted proxy allowlist
      # include here and keep nginx deny-by-default for direct origin traffic.
      # - ./trusted-proxies.conf:/etc/nginx/conf.d/trusted-proxies.conf:ro
    networks:
      - internal

  backup:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    command:
      [
        "sh",
        "-lc",
        "while true; do ./ops/backup.sh; sleep ${BACKUP_INTERVAL_SECONDS:-86400}; done"
      ]
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      BACKUP_DIR: ${BACKUP_DIR:-/backups}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - backup-data:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  monitor:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    command:
      [
        "sh",
        "-lc",
        "while true; do npx tsx ops/monitoring-check.ts; sleep ${MONITOR_INTERVAL_SECONDS:-300}; done"
      ]
    environment:
      HEALTHCHECK_URL: ${HEALTHCHECK_URL:-http://web:3000/healthz}
      DATABASE_URL: ${DATABASE_URL:-}
      MONITOR_INTERVAL_SECONDS: ${MONITOR_INTERVAL_SECONDS:-300}
      READINESS_SUMMARY_PATH: ${READINESS_SUMMARY_PATH:-/app/var/readiness-summary.json}
      CRAWL_SUMMARY_PATH: ${CRAWL_SUMMARY_PATH:-/app/var/crawl-summary.json}
    depends_on:
      postgres:
        condition: service_healthy
      web:
        condition: service_started
    networks:
      - internal

volumes:
  postgres-data:
  backup-data:

networks:
  internal:
    driver: bridge
