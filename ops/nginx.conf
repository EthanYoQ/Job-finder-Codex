upstream jobfinder_web {
    server web:3000;
    keepalive 32;
}

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=admin_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=search_limit:10m rate=15r/m;
limit_req_zone $binary_remote_addr zone=health_limit:10m rate=5r/m;

server {
    listen 80;
    server_name _;

    # Put Cloudflare or an equivalent WAF/CDN in front of this origin.
    # Aliyun Korea / Seoul can serve as the origin region for this server.
    # Locked origin template:
    # - mount a provider-managed trusted proxy allowlist include such as
    #   /etc/nginx/conf.d/trusted-proxies.conf with current CDN/WAF egress CIDRs
    # - configure the matching real_ip_header for that trusted proxy layer
    # - keep direct-to-origin access on a default deny / deny-by-default posture
    #   until requests come from the allowlist include; do not hardcode vendor IPs here

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    location = /robots.txt {
        proxy_pass http://jobfinder_web;
    }

    location = /healthz {
        add_header X-Robots-Tag "noindex, nofollow" always;
        limit_req zone=health_limit burst=2 nodelay;
        limit_req_status 429;
        proxy_pass http://jobfinder_web;
    }

    location ^~ /api/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://jobfinder_web;
    }

    location ^~ /admin/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        limit_req zone=admin_limit burst=10 nodelay;
        proxy_pass http://jobfinder_web;
    }

    location ^~ /search/ {
        limit_req zone=search_limit burst=20 nodelay;
        proxy_pass http://jobfinder_web;
    }

    location ^~ /batch/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        deny all;
    }

    location ^~ /raw/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        deny all;
    }

    location ~ /\. {
        deny all;
    }

    location / {
        proxy_pass http://jobfinder_web;
    }
}
