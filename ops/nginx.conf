upstream jobfinder_web {
    server web:3000;
    keepalive 32;
}

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=admin_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=search_limit:10m rate=15r/m;
limit_req_zone $binary_remote_addr zone=health_limit:10m rate=5r/m;

server {
    listen 80 default_server;
    server_name "";
    return 444;
}

server {
    listen 80;
    server_name ${PUBLIC_HOSTNAME};

    location / {
        return 308 https://$server_name$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    server_name "";

    ssl_certificate /run/tls/fullchain.pem;
    ssl_certificate_key /run/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 444;
}

server {
    listen 443 ssl;
    server_name ${PUBLIC_HOSTNAME};

    ssl_certificate /run/tls/fullchain.pem;
    ssl_certificate_key /run/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;

    client_max_body_size 1m;
    client_body_timeout 10s;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;

    # Put Cloudflare or an equivalent WAF/CDN in front of this origin.
    # Aliyun Korea / Seoul can serve as the origin region for this server.
    # Locked origin template:
    # - mount a provider-managed trusted proxy allowlist include such as
    #   /etc/nginx/conf.d/trusted-proxies.conf with current CDN/WAF egress CIDRs
    # - configure the matching real_ip_header for that trusted proxy layer
    # - keep direct-to-origin access on a default deny / deny-by-default posture
    #   until requests come from the allowlist include; do not hardcode vendor IPs here

    proxy_set_header Host $server_name;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    auth_request /__readiness_gate;
    error_page 500 =503 @ingress_not_ready;

    location @ingress_not_ready {
        auth_request off;
        return 503;
    }

    location = /__readiness_gate {
        internal;
        auth_request off;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_pass http://jobfinder_web/readyz;
    }

    location = /robots.txt {
        proxy_pass http://jobfinder_web;
    }

    location = /livez {
        auth_request off;
        add_header X-Robots-Tag "noindex, nofollow" always;
        limit_req zone=health_limit burst=2 nodelay;
        limit_req_status 429;
        proxy_pass http://jobfinder_web;
    }

    location = /healthz {
        auth_request off;
        add_header X-Robots-Tag "noindex, nofollow" always;
        limit_req zone=health_limit burst=2 nodelay;
        limit_req_status 429;
        proxy_pass http://jobfinder_web;
    }

    location = /readyz {
        auth_request off;
        add_header X-Robots-Tag "noindex, nofollow" always;
        limit_req zone=health_limit burst=2 nodelay;
        limit_req_status 429;
        proxy_pass http://jobfinder_web;
    }

    location ^~ /api/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://jobfinder_web;
    }

    location ^~ /admin/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        limit_req zone=admin_limit burst=10 nodelay;
        proxy_pass http://jobfinder_web;
    }

    location ^~ /search/ {
        limit_req zone=search_limit burst=20 nodelay;
        proxy_pass http://jobfinder_web;
    }

    location ^~ /batch/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        deny all;
    }

    location ^~ /raw/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        deny all;
    }

    location ~ /\. {
        deny all;
    }

    location / {
        proxy_pass http://jobfinder_web;
    }
}
