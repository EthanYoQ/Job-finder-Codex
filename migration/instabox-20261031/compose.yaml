# Inactive preparation. Start only after the target, credentials and schema route are approved.
# Reuses the existing single-service layout/healthcheck; source PostgreSQL is 17.6.
# Do NOT start PostgreSQL 17 on a PostgreSQL 16 physical data directory.
services:
  postgres:
    container_name: jobfinder-postgres
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jobfinder}
      POSTGRES_USER: ${POSTGRES_USER:-jobfinder}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?configure only after approval}
    volumes:
      - type: bind
        source: /data/job-finder/postgres
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"
