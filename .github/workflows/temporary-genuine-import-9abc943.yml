name: Temporary genuine source import 9abc943

on:
  create:

permissions:
  contents: read

concurrency:
  group: temporary-genuine-source-import-9abc943
  cancel-in-progress: false

env:
  EXPECTED_PAYLOAD_COMMIT: "dc58b683c49cf3c5a8123382f82ac7a291d42454"

jobs:
  verify-data:
    if: >-
      github.event.ref_type == 'branch' &&
      github.ref == 'refs/heads/tmp/genuine-import-9abc943-20261016' &&
      github.repository == 'EthanYoQ/Job-finder-Codex' &&
      github.repository_id == '1392742590' &&
      github.actor_id == '257484394' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: import-data
          sparse-checkout-cone-mode: true
      - name: Verify reviewed importer and sealed specification
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' '14120d1147fed94b07de5d5c0fcdc442131b0485470f6f3fd5aa821fb8d8b7fd' import-data/import_genuine.py | sha256sum --check --strict
          printf '%s  %s\n' '735b7ed7b724514b9cbc13b75250a1c759b0524d2f1c9dda2c0e159041c91b61' import-data/spec.json | sha256sum --check --strict
      - name: Verify data and repository preconditions without writing the repository
        shell: bash
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -I import-data/import_genuine.py prepare --input import-data --output "$RUNNER_TEMP/verified-import"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-genuine-import-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/verified-import/
          if-no-files-found: error
          retention-days: 1

  import-new-ref:
    needs: verify-data
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-genuine-import-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/verified-import
      - name: Verify reviewed artifacts again before introducing the write token
        shell: bash
        working-directory: ${{ runner.temp }}/verified-import
        run: |
          set -euo pipefail
          printf '%s  %s\n' '14120d1147fed94b07de5d5c0fcdc442131b0485470f6f3fd5aa821fb8d8b7fd' import_genuine.py | sha256sum --check --strict
          printf '%s  %s\n' '735b7ed7b724514b9cbc13b75250a1c759b0524d2f1c9dda2c0e159041c91b61' spec.json | sha256sum --check --strict
          printf '%s  %s\n' '29de0560216b98a15eb29ebc7aa89f4b6ff48a209fe72dc612e4c44891967717' source.bundle | sha256sum --check --strict
      - name: Verify genuine objects again and create exactly one new ref
        shell: bash
        env:
          GH_WRITE_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -I "$RUNNER_TEMP/verified-import/import_genuine.py" import --input "$RUNNER_TEMP/verified-import"
