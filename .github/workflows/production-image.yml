name: Production image

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean-build-and-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      IMAGE_TAG: job-finder:${{ github.sha }}
      # Measured clean image: 1,537,937,087 bytes; keep a narrow regression budget.
      MAX_IMAGE_BYTES: 1600000000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.1
          cache: npm

      - run: npm ci
      - name: Export commit-bound Docker provenance
        run: |
          npm run docker:export-provenance
          SOURCE_TREE_SHA256="$(npx tsx -e "import { canonicalSourceTreeSha256 } from './src/readiness/buildIdentity.ts'; process.stdout.write(canonicalSourceTreeSha256(process.cwd()))")"
          echo "SOURCE_TREE_SHA256=$SOURCE_TREE_SHA256" >> "$GITHUB_ENV"
      - run: npm run image:context-check
      - run: npm run image:runtime-contract-check

      - name: Build from a clean context
        run: >-
          docker build --pull --no-cache
          --build-arg BUILD_COMMIT_SHA=${{ github.sha }}
          --build-arg BUILD_SOURCE_CLEAN=true
          --build-arg BUILD_SOURCE_TREE_SHA256="$SOURCE_TREE_SHA256"
          --tag "$IMAGE_TAG" .

      - name: Enforce runtime identity and image size
        run: |
          IMAGE_USER="$(docker image inspect --format '{{.Config.User}}' "$IMAGE_TAG")"
          IMAGE_REVISION="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$IMAGE_TAG")"
          IMAGE_BYTES="$(docker image inspect --format '{{.Size}}' "$IMAGE_TAG")"
          printf 'runtime_user=%s\nrevision=%s\nimage_bytes=%s\nmax_image_bytes=%s\n' "$IMAGE_USER" "$IMAGE_REVISION" "$IMAGE_BYTES" "$MAX_IMAGE_BYTES"
          test "$IMAGE_USER" = "node"
          test "$IMAGE_REVISION" = "${{ github.sha }}"
          test "$IMAGE_BYTES" -le "$MAX_IMAGE_BYTES"

      - name: Start in a blank Linux container and probe liveness
        run: |
          ADMIN_HASH='scrypt$aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa$bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb'
          CONTAINER_ID="$(docker run --detach --publish 127.0.0.1:3000:3000 \
            --env DATABASE_URL=postgresql://unused:unused@127.0.0.1:5432/unused \
            --env ADMIN_EMAIL=owner@example.com --env ADMIN_PASSWORD_HASH="$ADMIN_HASH" "$IMAGE_TAG")"
          trap 'docker rm --force "$CONTAINER_ID" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/livez | grep --quiet '"ok":true'; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$CONTAINER_ID"
          exit 1

      - name: Prove production bootstrap idempotence and readiness against blank PostgreSQL
        run: |
          set -euo pipefail
          NETWORK="job-finder-bootstrap-${{ github.run_id }}"
          POSTGRES_NAME="job-finder-postgres-${{ github.run_id }}"
          APP_NAME="job-finder-web-${{ github.run_id }}"
          ADMIN_HASH='scrypt$aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa$bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb'
          DATABASE_URL='postgresql://jobfinder:bootstrap-test-password@postgres/jobfinder?schema=public'
          docker network create "$NETWORK"
          trap 'docker rm --force "$APP_NAME" "$POSTGRES_NAME" >/dev/null 2>&1 || true; docker network rm "$NETWORK" >/dev/null 2>&1 || true' EXIT
          docker run --detach --name "$POSTGRES_NAME" --network "$NETWORK" --network-alias postgres \
            --env POSTGRES_DB=jobfinder --env POSTGRES_USER=jobfinder --env POSTGRES_PASSWORD=bootstrap-test-password \
            postgres:16-bookworm@sha256:da788743d2060767375896de4d646f7576f5911461444b372616f19ea61db2ec
          POSTGRES_READY=0
          for attempt in $(seq 1 30); do
            if docker exec "$POSTGRES_NAME" pg_isready -U jobfinder -d jobfinder; then POSTGRES_READY=1; break; fi
            sleep 1
          done
          test "$POSTGRES_READY" = 1
          docker run --rm --network "$NETWORK" --env DATABASE_URL="$DATABASE_URL" \
            "$IMAGE_TAG" node node_modules/prisma/build/index.js migrate deploy
          docker run --rm --network "$NETWORK" --env DATABASE_URL="$DATABASE_URL" \
            --env ADMIN_EMAIL=owner@example.com --env ADMIN_PASSWORD_HASH="$ADMIN_HASH" "$IMAGE_TAG" npm run ops:bootstrap &
          FIRST_PID=$!
          docker run --rm --network "$NETWORK" --env DATABASE_URL="$DATABASE_URL" \
            --env ADMIN_EMAIL=owner@example.com --env ADMIN_PASSWORD_HASH="$ADMIN_HASH" "$IMAGE_TAG" npm run ops:bootstrap &
          SECOND_PID=$!
          wait "$FIRST_PID"
          wait "$SECOND_PID"
          docker run --rm --network "$NETWORK" --env DATABASE_URL="$DATABASE_URL" \
            --env ADMIN_EMAIL=owner@example.com --env ADMIN_PASSWORD_HASH="$ADMIN_HASH" "$IMAGE_TAG" npm run ops:bootstrap
          test "$(docker exec "$POSTGRES_NAME" psql -U jobfinder -d jobfinder -Atc 'SELECT count(*) FROM "AdminUser"')" = "1"
          test "$(docker exec "$POSTGRES_NAME" psql -U jobfinder -d jobfinder -Atc \"SELECT count(*) FROM \\\"AdminAuditEvent\\\" WHERE action='DEPLOYMENT_ADMIN_BOOTSTRAPPED'\")" = "1"
          docker run --detach --name "$APP_NAME" --network "$NETWORK" --env DATABASE_URL="$DATABASE_URL" \
            --env ADMIN_EMAIL=owner@example.com --env ADMIN_PASSWORD_HASH="$ADMIN_HASH" "$IMAGE_TAG"
          APP_READY=0
          for attempt in $(seq 1 30); do
            if docker exec "$APP_NAME" node -e "fetch('http://127.0.0.1:3000/readyz').then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"; then APP_READY=1; break; fi
            sleep 1
          done
          test "$APP_READY" = 1
          docker stop "$POSTGRES_NAME"
          sleep 1
          docker exec "$APP_NAME" node -e "fetch('http://127.0.0.1:3000/readyz').then(r=>process.exit(r.status===503?0:1)).catch(()=>process.exit(1))"
          docker start "$POSTGRES_NAME"
          POSTGRES_READY=0
          for attempt in $(seq 1 30); do
            if docker exec "$POSTGRES_NAME" pg_isready -U jobfinder -d jobfinder; then POSTGRES_READY=1; break; fi
            sleep 1
          done
          test "$POSTGRES_READY" = 1
          APP_READY=0
          for attempt in $(seq 1 30); do
            if docker exec "$APP_NAME" node -e "fetch('http://127.0.0.1:3000/readyz').then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"; then APP_READY=1; break; fi
            sleep 1
          done
          test "$APP_READY" = 1
          docker exec "$POSTGRES_NAME" psql -U jobfinder -d jobfinder -v ON_ERROR_STOP=1 -c \
            "INSERT INTO \"_prisma_migrations\" (id,checksum,migration_name,started_at,applied_steps_count) VALUES ('00000000-0000-0000-0000-000000000000',repeat('0',64),'99999999999999_unfinished',now(),0)"
          sleep 2
          docker exec "$APP_NAME" node -e "fetch('http://127.0.0.1:3000/readyz').then(r=>process.exit(r.status===503?0:1)).catch(()=>process.exit(1))"
