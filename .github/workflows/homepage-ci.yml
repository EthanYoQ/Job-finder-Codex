name: Homepage CI

on:
  pull_request:
    branches:
      - human-verified-code
  push:
    branches:
      - human-verified-code
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homepage-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.1
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate --schema prisma/schema.prisma
      - name: Typecheck
        run: npm run typecheck

  verify:
    name: Tests, homepage build, and provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema prisma/schema.prisma

      - name: Prepare test runtime prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends poppler-utils
          mkdir -p .runtime/.cache
          docker --version
          docker compose version
          pwsh --version
          pdfinfo -v
          pdftotext -v

      - name: Run the complete default test suite
        if: ${{ !cancelled() }}
        run: npm test

      - name: Build the homepage
        if: ${{ !cancelled() }}
        run: npm run build

      - name: Verify Docker source provenance and context budget
        if: ${{ !cancelled() }}
        run: |
          npm run docker:export-provenance
          npm run image:context-check

      - name: Verify packaged public assets
        if: ${{ !cancelled() }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, readdirSync } from 'node:fs';
          import { join, relative } from 'node:path';
          const files = readdirSync('public', { recursive: true, withFileTypes: true })
            .filter(entry => entry.isFile());
          if (!files.some(entry => entry.name.endsWith('.woff2'))) {
            throw new Error('No self-hosted fonts were packaged');
          }
          for (const entry of files) {
            const source = join(entry.parentPath, entry.name);
            const built = join('dist', relative('public', source));
            if (!readFileSync(source).equals(readFileSync(built))) {
              throw new Error(`Public asset changed during build: ${source}`);
            }
          }
          console.log(`Verified ${files.length} public assets against the build output`);
          NODE
